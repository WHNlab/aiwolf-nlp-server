services:
  server:
    build:
      context: .
      args:
        VERSION: docker
    image: aiwolf-nlp-server:local
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      HOST: "0.0.0.0"
      PORT: "8081"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      PUBLIC_WS_URL: "${PUBLIC_WS_URL:-wss://zinro-ws.nyaolab.com/ws}"
      SECRET_KEY: "${SECRET_KEY:-}"
      AIWOLF_REPLAY_DIR: "/data/room-replays"
      AIWOLF_DATA_DIR: "/data"
      # レンタルAI（運営提供のOpenAI呼び出し）。未設定ならレンタルは無効。
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # 予算上限（USD）。未設定・0ならレンタルは無効のまま。
      AIWOLF_RENTAL_DAILY_USD: "${AIWOLF_RENTAL_DAILY_USD:-}"
      AIWOLF_RENTAL_MATCH_USD: "${AIWOLF_RENTAL_MATCH_USD:-}"
    volumes:
      - ./config:/config
      - ./log:/log
      - aiwolf-replays:/data
    command: ["-c", "/config/default_5.yml"]

  # TTS用の任意のVOICEVOXエンジン。利用するにはこのサービスのコメントを外し、
  # 設定ファイルの tts_broadcaster.host に http://voicevox:50021 を設定する
  # （設定ファイルで tts_broadcaster も有効にする）。
  # スリムなサーバイメージには ffmpeg が無いため、TTSを使う場合は ffmpeg 入りの
  # イメージ（alpineベース + apk add ffmpeg）をビルドすること。
  # voicevox:
  #   image: voicevox/voicevox_engine:cpu-latest
  #   ports:
  #     - "50021:50021"

volumes:
  aiwolf-replays:
